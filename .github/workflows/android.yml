name: MEYDAN APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore existing APK signing key
        env:
          MEYDAN_KEYSTORE_BASE64: ${{ secrets.MEYDAN_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import os, base64
          from pathlib import Path
          secret = os.environ.get('MEYDAN_KEYSTORE_BASE64', '')
          if not secret:
              raise SystemExit('Add the MEYDAN_KEYSTORE_BASE64 Actions secret before building.')
          Path('android/local-signing.p12').write_bytes(base64.b64decode(secret, validate=True))
          PY
      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build and verify signed APK
        run: |
          python build_apk.py
          python test_package.py
      - name: Upload installable APK and standalone game
        uses: actions/upload-artifact@v7
        with:
          name: MEYDAN-${{ github.run_number }}
          path: |
            MEYDAN.apk
            MEYDAN.html
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: python -c "from pathlib import Path; Path('android/local-signing.p12').unlink(missing_ok=True)"
